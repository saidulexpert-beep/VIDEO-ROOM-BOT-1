<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIRAL VIDEO LINK</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Ad SDKs -->
  <script src='//libtl.com/sdk.js'></script>
  <script src="https://ad.gigapub.tech/script?id=2200"></script>
  <script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
  <script src="https://adexora.com/cdn/ads.js?id=648"></script>

  <style>
    :root {
      --bg-color: #0b0c0e;
      --card-bg: #13151b;
      --primary-gold: #ffab00;
      --primary-gold-dark: #d99200;
      --secondary-blue: #121927;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --border-color: #1f232d;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Hind Siliguri', sans-serif;
      padding-bottom: 70px; /* Space for bottom nav */
    }

    /* Top Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--bg-color);
      border-bottom: 1px solid #1a1c23;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title .badge {
      background-color: var(--primary-gold);
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 1.2rem;
    }

    /* Main Container */
    .content-container {
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Login / Loading Screen */
    .login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    /* Video Player Area */
    .player-wrapper {
      position: relative;
      width: 100%;
      background-color: #000;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none; /* Initially hidden until video clicked */
    }

    .player-wrapper.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-wrapper iframe,
    .player-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Top Filter Buttons */
    .top-filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .filter-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
    }

    .filter-btn.gold {
      background: linear-gradient(135deg, #ffab00, #e69500);
      color: #000;
    }

    .filter-btn.dark {
      background-color: var(--secondary-blue);
      border: 1px solid #1e293b;
      color: #fff;
    }

    .filter-btn .main-text {
      font-size: 1rem;
      font-weight: 700;
    }

    .filter-btn .sub-text {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.85;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Category Scroll Pills */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .chip {
      background-color: #1a1d26;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .chip.active {
      background-color: var(--primary-gold);
      color: #000;
      border-color: var(--primary-gold);
    }

    /* Notice Marquee Bar */
    .notice-bar {
      background-color: #161820;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #d1d5db;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
    }

    .section-heading {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 12px 0;
    }

    /* Video Feed & Cards */
    .video-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      cursor: pointer;
    }

    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .play-watermark {
      position: absolute;
      top: 8px;
      right: 8px;
      color: #ff4d4d;
      font-size: 1.2rem;
    }

    .video-card.locked .thumbnail-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
    }

    .lock-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      z-index: 2;
    }

    .video-content {
      padding: 12px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 0;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .share-btn {
      background-color: #272013;
      border: 1px solid #4d3a14;
      color: var(--primary-gold);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      background-color: #1b1e27;
      padding: 4px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: #d1d5db;
    }

    /* Fixed Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #0b0c0e;
      border-top: 1px solid #1a1c23;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.8rem;
      width: 45%;
      height: 42px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-item.active {
      background-color: #221a0d;
      color: var(--primary-gold);
      font-weight: 700;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      margin-bottom: 2px;
    }

    /* Unlock Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-body {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 340px;
      border: 1px solid var(--border-color);
    }

    .modal-body h3 {
      margin-top: 0;
    }

    .ad-counter {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-gold);
      margin: 12px 0;
    }

    .btn-primary {
      background-color: var(--primary-gold);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-close {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <button class="header-icon-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="brand-title">
      VIRAL <span class="badge">VIDEO LINK</span>
    </div>
    <button class="header-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
  </header>

  <div class="content-container">
    
    <div class="login-screen" id="login-screen">
      <div>সংযোগ করা হচ্ছে...</div>
    </div>

    <div id="main-app" style="display: none;">
      
      <!-- Video Player Wrapper -->
      <div class="player-wrapper" id="player-container"></div>

      <!-- Main Filter Buttons -->
      <div class="top-filters">
        <button class="filter-btn gold">
          <span class="main-text">All Videos</span>
          <span class="sub-text">NEWEST POSTS FIRST</span>
        </button>
        <button class="filter-btn dark">
          <span class="main-text">Trending</span>
          <span class="sub-text">MOST VIEWED FIRST</span>
        </button>
      </div>

      <!-- Categories Scroll Pills -->
      <div class="category-scroll">
        <div class="chip active">All Videos</div>
        <div class="chip">viral videos || ভাইরাল ভিডিও</div>
        <div class="chip">Movies</div>
      </div>

      <!-- Marquee Notice -->
      <div class="notice-bar">
        <span>🔒 | 📢 বেশি শেয়ার = বেশি ভিডিও 🔥 আপনার একটুখানি শেয়ার আমাদের অনুপ্রেরণা...</span>
      </div>

      <!-- Heading -->
      <h2 class="section-heading">Latest Videos</h2>

      <!-- Video Feed List -->
      <div class="video-feed" id="video-feed"></div>

    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Profile
    </button>
  </nav>

  <!-- Unlock Modal -->
  <div class="modal-overlay" id="unlock-modal">
    <div class="modal-body">
      <h3>🔒 ভিডিওটি লক করা</h3>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">এই ভিডিওটি আনলক করতে ৫টি বিজ্ঞাপন দেখুন।</p>
      <div class="ad-counter">
        <span id="ad-count">০</span> / ৫
      </div>
      <button class="btn-primary" id="watch-ad-btn">বিজ্ঞাপন দেখুন</button>
      <button class="btn-close" id="close-modal-btn">বন্ধ করুন</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const VideoApp = {
      config: { videos: [] },
      firebaseConfig: {
        apiKey: "AIzaSyA6JPDxbD5k1S-7bNikp6U_vFALPFl_fto",
        authDomain: "daily-paybot.firebaseapp.com",
        databaseURL: "https://daily-paybot-default-rtdb.firebaseio.com",
        projectId: "daily-paybot",
        storageBucket: "daily-paybot.firebasestorage.app",
        messagingSenderId: "962422978466",
        appId: "1:962422978466:web:43a3db97932bf82766e4fb"
      },

      state: {
        currentHls: null,
        unlockedVideos: [0],
        adsWatched: 0,
        videoToUnlock: null,
        currentAdIndex: 0
      },

      elements: {
        playerContainer: document.getElementById('player-container'),
        videoFeed: document.getElementById('video-feed'),
        loginScreen: document.getElementById('login-screen'),
        mainApp: document.getElementById('main-app'),
        unlockModal: document.getElementById('unlock-modal'),
        adCount: document.getElementById('ad-count'),
        watchAdBtn: document.getElementById('watch-ad-btn'),
        closeModalBtn: document.getElementById('close-modal-btn')
      },

      ads: [
        () => new Promise((resolve) => { try { LibTl.SDK.show(10117142); resolve(); } catch(e){ resolve(); } }),
        () => new Promise((resolve) => { window.showGiga ? window.showGiga().then(resolve).catch(resolve) : resolve(); }),
        () => new Promise((resolve) => { try { new AdexiumWidget({wid: '6052f786-5400-4390-a082-0c893fc47da3', adFormat: 'push-like'}).autoMode(); resolve(); } catch(e){ resolve(); } }),
        () => new Promise((resolve) => { window.showAdexora ? window.showAdexora().then(resolve).catch(resolve) : resolve(); }),
        () => new Promise((resolve) => { try { LibTl.SDK.show(10056357); resolve(); } catch(e){ resolve(); } })
      ],

      init() {
        this.loadUnlockedState();
        this.addEvents();
        this.handleTelegramLogin();
      },

      addEvents() {
        this.elements.watchAdBtn.onclick = () => this.watchAd();
        this.elements.closeModalBtn.onclick = () => this.elements.unlockModal.style.display = 'none';
      },

      handleTelegramLogin() {
        const tg = window.Telegram.WebApp;
        tg.ready();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          this.initFirebase();
        } else {
          // Fallback testing outside Telegram
          this.initFirebase();
        }
      },

      initFirebase() {
        firebase.initializeApp(this.firebaseConfig);
        const db = firebase.database();
        db.ref('/videos').on('value', (snapshot) => {
          const data = snapshot.val();
          if (data && Array.isArray(data)) {
            this.config.videos = data.filter(v => v && v.url);
            this.showApp();
          } else {
            this.elements.loginScreen.innerText = "কোনো ভিডিও পাওয়া যায়নি।";
          }
        });
      },

      showApp() {
        this.elements.loginScreen.style.display = 'none';
        this.elements.mainApp.style.display = 'block';
        this.renderFeed();
      },

      renderFeed() {
        this.elements.videoFeed.innerHTML = '';
        this.config.videos.forEach((video, index) => {
          const isUnlocked = this.state.unlockedVideos.includes(index);
          const card = document.createElement('div');
          card.className = `video-card ${isUnlocked ? '' : 'locked'}`;

          card.innerHTML = `
            <div class="thumbnail-box" onclick="VideoApp.onVideoClick(${index})">
              <img src="${video.thumbnail}" alt="${video.title}">
              <span class="duration-badge">${video.duration || '4K 2:07:33'}</span>
              <span class="play-watermark">▶</span>
              ${!isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}
            </div>
            <div class="video-content">
              <div class="title-row">
                <h3 class="video-title">${video.title}</h3>
                <button class="share-btn">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </button>
              </div>
              <div class="meta-row">
                <div class="stats-group">
                  <span class="stat-pill">👁️ ${video.views || '796'}</span>
                  <span class="stat-pill">❤️ ${video.likes || '13'}</span>
                </div>
                <span>${video.timeAgo || '2 month ago'}</span>
              </div>
            </div>
          `;
          this.elements.videoFeed.appendChild(card);
        });
      },

      onVideoClick(index) {
        if (this.state.unlockedVideos.includes(index)) {
          this.loadVideo(index);
        } else {
          this.promptUnlock(index);
        }
      },

      promptUnlock(index) {
        this.state.videoToUnlock = index;
        this.state.adsWatched = 0;
        this.elements.adCount.innerText = "০";
        this.elements.unlockModal.style.display = 'flex';
      },

      async watchAd() {
        const btn = this.elements.watchAdBtn;
        btn.disabled = true;
        btn.innerText = 'লোড হচ্ছে...';

        await this.ads[this.state.currentAdIndex]();
        this.state.adsWatched++;
        this.elements.adCount.innerText = this.state.adsWatched;
        this.state.currentAdIndex = (this.state.currentAdIndex + 1) % this.ads.length;

        if (this.state.adsWatched >= 5) {
          this.state.unlockedVideos.push(this.state.videoToUnlock);
          this.saveUnlockedState();
          this.elements.unlockModal.style.display = 'none';
          this.renderFeed();
          this.loadVideo(this.state.videoToUnlock);
        }

        btn.disabled = false;
        btn.innerText = 'বিজ্ঞাপন দেখুন';
      },

      loadVideo(index) {
        const video = this.config.videos[index];
        const container = this.elements.playerContainer;
        container.classList.add('active');
        container.innerHTML = '';

        if (video.url.includes('.m3u8')) {
          const videoEl = document.createElement('video');
          videoEl.controls = true;
          videoEl.autoplay = true;
          if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(video.url);
            hls.attachMedia(videoEl);
          } else {
            videoEl.src = video.url;
          }
          container.appendChild(videoEl);
        } else if (video.url.match(/\.(mp4|webm)/)) {
          const videoEl = document.createElement('video');
          videoEl.controls = true;
          videoEl.autoplay = true;
          videoEl.src = video.url;
          container.appendChild(videoEl);
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = video.url;
          iframe.allow = "autoplay; fullscreen";
          container.appendChild(iframe);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      saveUnlockedState() {
        localStorage.setItem('unlockedVideos', JSON.stringify(this.state.unlockedVideos));
      },

      loadUnlockedState() {
        const saved = localStorage.getItem('unlockedVideos');
        if (saved) this.state.unlockedVideos = JSON.parse(saved);
      }
    };

    document.addEventListener('DOMContentLoaded', () => VideoApp.init());
  </script>
</body>
</html>
